<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iting — Asisten Ventra</title>
<meta name="description" content="Asisten AI customer support dengan perlindungan data pribadi otomatis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================== Design tokens ==============================
     Flat, restrained palette — one accent colour, no gradients, no drop-shadow
     decoration. Reads as a real assistant app (Claude/ChatGPT-shaped), not a
     marketing widget: full-bleed shell, no floating card, no banner chrome. */
  :root {
    --color-accent: #C81E1E;
    --color-accent-hover: #A81414;
    --color-on-accent: #FFFFFF;
    --color-background: #FFF8F8;
    --color-surface: #F7F7F8;
    --color-foreground: #241515;
    --color-muted-foreground: #715F5F;
    --color-border: #EEDADA;
    --color-destructive: #B3271E;
    --color-destructive-bg: #FCEEED;
    --color-ring: #C81E1E;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
    color-scheme: light;
  }
  /* ============================== Reset & base ============================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--color-background);
    color: var(--color-foreground);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 25%, transparent); }
  a { color: var(--color-accent); }

  :focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ============================== Shell layout ==============================
     No card, no shadow, no rounded outer frame — the app fills the viewport,
     same as a real assistant product. */
  .shell {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }
  .app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    height: 100%;
  }

  /* ============================== Header ============================== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted-foreground); }
  .status-dot { width: 6px; height: 6px; border-radius: 999px; background: #C81E1E; flex-shrink: 0; }
  .status-dot.offline { background: var(--color-destructive); }
  .status-dot.connecting { background: #C08A1E; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .header-actions { display: flex; align-items: center; gap: var(--space-1); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--color-muted-foreground); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--color-surface); color: var(--color-foreground); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ============================== Transcript ============================== */
  .transcript {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
  }
  .transcript-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-5) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    min-height: 100%;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .suggestion-chip {
    border: 1px solid var(--color-border); background: none;
    color: var(--color-foreground); border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; cursor: pointer; transition: border-color 120ms, background 120ms;
    min-height: 36px;
  }
  .suggestion-chip:hover { border-color: var(--color-accent); background: var(--color-surface); }

  .row { display: flex; gap: var(--space-3); max-width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.agent { align-items: flex-start; }
  .row.system { justify-content: center; }

  /* Assistant messages: no bubble, plain text on the page background — this is
     the single biggest cue that reads as "real AI assistant" vs. "support widget". */
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    overflow: hidden; margin-top: 2px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .bubble-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .row.agent .bubble-col { max-width: 100%; }
  .row.user .bubble-col { align-items: flex-end; max-width: 80%; }

  .bubble {
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--color-surface);
    padding: 9px 14px;
    border-radius: var(--radius-md);
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 600; }
  .bubble a { color: inherit; text-decoration: underline; }

  .msg-meta { font-size: 11px; color: var(--color-muted-foreground); padding: 0 2px; }

  /* Quick-reply buttons parsed from the agent's own [PILIHAN] line (see prompts.py) —
     same visual language as the welcome screen's suggestion chips, on purpose: one
     "tappable option" pattern in the whole app, not a second competing style. */
  .quick-replies { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 2px; }
  .quick-reply-chip {
    border: 1px solid var(--color-border); background: none;
    color: var(--color-accent); border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; font-weight: 500; cursor: pointer;
    transition: border-color 120ms, background 120ms; min-height: 36px;
  }
  .quick-reply-chip:hover { border-color: var(--color-accent); background: var(--color-surface); }

  /* Per-message proof that the guardrail acted on THIS message — attached where the
     evidence is relevant, not as a page-wide banner. Only appears when something was
     actually found (server-verified), so it never fires on messages with no PII. */
  .redact-note {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--color-muted-foreground);
    padding: 0 2px; animation: fade-in 200ms ease;
  }
  .redact-note svg { width: 11px; height: 11px; flex-shrink: 0; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* Tool activity — a quiet inline line, not an iconography showcase */
  .tool-chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--color-muted-foreground);
    padding: 2px 0;
  }
  .tool-chip .dot { width: 4px; height: 4px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
  .tool-chip.spinning .dot { animation: dot-pulse 1s ease-in-out infinite; }
  .tool-chip.done { color: var(--color-muted-foreground); }
  .tool-chip.done .dot { background: #C81E1E; }
  @keyframes dot-pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; height: 22px; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--color-muted-foreground);
    animation: bounce 1.3s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:.4 } 30%{ transform: translateY(-4px); opacity:1 } }

  /* System / error messages */
  .system-msg {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; padding: 9px 13px; border-radius: var(--radius-sm);
    background: var(--color-destructive-bg); color: var(--color-destructive);
    max-width: 480px;
  }
  .system-msg svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
  .system-msg .retry-btn {
    margin-left: auto; flex-shrink: 0; border: 1px solid currentColor; background: transparent;
    color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
    min-height: 28px;
  }
  .system-msg .retry-btn:hover { background: color-mix(in srgb, var(--color-destructive) 10%, transparent); }

  /* ============================== Composer ============================== */
  .composer-wrap {
    flex-shrink: 0;
    padding: 0 var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom));
  }
  .composer-inner { max-width: 720px; margin: 0 auto; }
  .composer {
    display: flex; align-items: flex-end; gap: var(--space-2);
    border: 1px solid var(--color-border); border-radius: 24px;
    background: var(--color-background);
    padding: 8px 8px 8px 18px;
    transition: border-color 120ms ease;
  }
  .composer:focus-within { border-color: var(--color-accent); }
  .composer textarea {
    flex: 1; border: none; background: transparent; resize: none;
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    color: var(--color-foreground); padding: 7px 0; max-height: 140px; min-height: 22px;
  }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: var(--color-muted-foreground); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 999px; border: none; flex-shrink: 0;
    background: var(--color-accent); color: var(--color-on-accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 120ms ease, opacity 120ms ease;
  }
  .send-btn:hover:not(:disabled) { background: var(--color-accent-hover); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }
  .composer-foot {
    margin: var(--space-2) 2px 0;
    font-size: 11.5px; color: var(--color-muted-foreground);
    text-align: center;
  }
  .composer-foot .trust-note { transition: color 200ms ease; }
  .composer-foot .trust-note.flash { color: var(--color-accent); }

  /* Scrollbar (webkit) */
  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 999px; }
  .transcript::-webkit-scrollbar-track { background: transparent; }

  /* Single, intentional visual direction: a bright contemporary support desk. */
  :root {
    --color-accent: #C81E1E; --color-accent-hover: #A81414; --color-on-accent: #FFFFFF;
    --color-background: #FFF8F8; --color-surface: #FFFFFF; --color-foreground: #241515;
    --color-muted-foreground: #715F5F; --color-border: #EEDADA; --color-destructive: #B42318;
    --color-destructive-bg: #FEF3F2; --color-ring: #C81E1E; --radius-sm: 10px; --radius-md: 16px;
    --font-body: 'Outfit', system-ui, -apple-system, sans-serif; color-scheme: light;
  }
  body { background-color: var(--color-background); background-image: radial-gradient(circle at 8% -10%, #FFDADA 0, transparent 32%), radial-gradient(circle at 98% 12%, #FFF0F0 0, transparent 26%); }
  .shell { padding: 18px; }
  .app { max-width: 880px; margin: 0 auto; overflow: hidden; background: #FFFFFF; border: 1px solid #F2DADA; border-radius: 24px; box-shadow: 0 22px 50px rgba(113,31,31,.14); }
  .header { padding: 13px 20px; color: #FFFFFF; background: #D71920; border-bottom: 0; }
  .brand-avatar { width: 40px; height: 40px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: #FFFFFF; border: 2px solid rgba(255,255,255,.75); }
  .brand-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-copy { display: grid; gap: 1px; }
  .brand-name { color: #FFFFFF; font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
  .status-line { color: rgba(255,255,255,.82); }
  .status-dot { width: 7px; height: 7px; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(255,255,255,.16); }
  .status-dot.connecting { background: #FFFFFF; }
  .status-dot.offline { background: #FFD8D8; }
  .header-actions { gap: 8px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.10); color: #FFFFFF; transition: transform 180ms ease, background 180ms ease, color 180ms ease; }
  .icon-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.22); color: #FFFFFF; }
  .transcript-inner { width: min(100%, 700px); padding: 38px 24px 16px; }
  .welcome { animation: enter .35s ease both; }
  .welcome .bubble-col { max-width: min(88%, 620px); }
  .welcome .bubble { background: #FFF4F4; padding: 12px 15px; border: 1px solid #F7E8E8; border-radius: 4px 16px 16px 16px; box-shadow: 0 6px 18px rgba(92,35,35,.05); }
  .initial-suggestions { margin-top: 4px; }
  .initial-suggestions.hidden { display: none; }
  .suggestion-chip { border-radius: 12px; background: #fff; padding: 10px 13px; font-size: 13px; font-weight: 500; min-height: 42px; transition: transform 180ms ease, border-color 180ms ease, background 180ms ease; }
  .suggestion-chip:hover { transform: translateY(-2px); border-color: #E8A2A2; background: #FFF0F0; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .avatar { width: 34px; height: 34px; border-radius: 12px; box-shadow: 0 4px 10px rgba(108,35,35,.12); }
  .row.agent .bubble-col { max-width: min(88%, 620px); }
  .bubble { line-height: 1.65; }
  .row.agent .bubble { background: #FFF4F4; padding: 12px 15px; border: 1px solid #F7E8E8; border-radius: 4px 16px 16px 16px; box-shadow: 0 6px 18px rgba(92,35,35,.05); }
  .row.user .bubble { color: #fff; background: linear-gradient(135deg, #D52B2B, #B71919); padding: 11px 15px; border-radius: 16px 4px 16px 16px; box-shadow: 0 7px 16px rgba(176,28,28,.18); }
  .quick-reply-chip { border-color: #F0BABA; background: #FFF9F9; color: #A81414; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; min-height: 40px; transition: transform 180ms ease, border-color 180ms ease, background 180ms ease; }
  .quick-reply-chip:hover { transform: translateY(-1px); border-color: var(--color-accent); background: #FFF0F0; }
  .redact-note { width: fit-content; color: #A81414; padding: 4px 8px; border-radius: 99px; background: #FFF0F0; }
  .tool-chip { width: fit-content; padding: 6px 9px; border-radius: 8px; background: #FFF0F0; }
  .composer-wrap { padding: 8px 24px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.92) 28%); }
  .composer-inner { max-width: 700px; }
  .composer { border-radius: 18px; background: #fff; padding: 8px 8px 8px 16px; box-shadow: 0 10px 28px rgba(90,31,31,.08); transition: border-color 180ms ease, box-shadow 180ms ease; }
  .composer:focus-within { border-color: #E18888; box-shadow: 0 0 0 4px rgba(200,30,30,.10), 0 10px 28px rgba(90,31,31,.08); }
  .composer textarea { padding: 9px 0; min-height: 26px; }
  .send-btn { width: 42px; height: 42px; border-radius: 13px; transition: transform 180ms ease, background 180ms ease, opacity 180ms ease; }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px); }
  @media (max-width: 600px) { .shell { padding: 0; } .app { border: 0; border-radius: 0; } .header { padding: 13px 16px; } .transcript-inner { padding: 24px 16px 12px; } .row.user .bubble-col, .row.agent .bubble-col { max-width: 88%; } .composer-wrap { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); } }
</style>
</head>
<body>

<div class="shell" id="shell">

  <div class="app">

  <!-- ============================== Header ============================== -->
  <header class="header">
    <div class="brand">
      <span class="brand-avatar" aria-hidden="true"><img src="avatar.png" alt="" width="40" height="40"></span>
      <span class="brand-copy"><span class="brand-name">Iting</span><span class="status-line"><span class="status-dot connecting" id="statusDot" aria-hidden="true"></span><span id="statusText">Menghubungkan…</span></span></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="resetBtn" type="button" aria-label="Hapus percakapan ini" title="Hapus percakapan">
        <svg id="resetIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
  </header>

  <!-- ============================== Transcript ============================== -->
  <main class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Riwayat percakapan">
    <div class="transcript-inner">
      <div class="welcome row agent" id="welcome">
        <div class="avatar" aria-hidden="true"><img src="avatar.png" alt="" width="30" height="30"></div>
        <div class="bubble-col">
          <div class="bubble"><span id="greetingText">Halo</span>, Kak! Saya Iting, asisten virtual Ventra. Ada yang bisa Iting bantu hari ini?</div>
          <div class="msg-meta">Iting · <span id="greetingTime">WIB</span></div>
          <div class="suggestions initial-suggestions">
          <button class="suggestion-chip" type="button" data-prompt="Internet di rumah saya mati sejak pagi, mohon dibantu.">Internet saya mati</button>
          <button class="suggestion-chip" type="button" data-prompt="Saya mau cek tagihan bulan ini.">Cek tagihan</button>
          <button class="suggestion-chip" type="button" data-prompt="Saya ingin pindah alamat pemasangan.">Pindah alamat</button>
          <button class="suggestion-chip" type="button" data-prompt="Lampu indikator modem saya menyala merah.">Lampu modem merah</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ============================== Composer ============================== -->
  <div class="composer-wrap">
    <div class="composer-inner">
      <form class="composer" id="composerForm">
        <label for="messageInput" class="sr-only">Tulis pesan</label>
        <textarea id="messageInput" rows="1" placeholder="Tulis pesan…" maxlength="2000" autocomplete="off"></textarea>
        <button class="send-btn" type="submit" id="sendBtn" aria-label="Kirim pesan" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <div class="composer-foot">
        <span class="trust-note" id="trustDetail">Data pribadi Anda disamarkan otomatis sebelum diproses AI</span>
      </div>
    </div>
  </div>

  </div>

</div>

<script>
(() => {
  'use strict';

  /* ============================== Config ============================== */
  const params = new URLSearchParams(location.search);
  const API_BASE = params.get('api') || window.VENTRA_API_BASE || 'http://localhost:8000';
  const APP_NAME = 'cs_agent';
  const STORAGE_USER = 'ventra_user_id';
  const STORAGE_SESSION = 'ventra_session_id';

  const TOOL_LABELS = {
    cek_tagihan: 'Mengecek tagihan…',
    cek_gangguan_wilayah: 'Mengecek status gangguan…',
    buat_tiket_pengaduan: 'Membuat tiket pengaduan…',
    cek_status_tiket: 'Mengecek status tiket…',
    ubah_alamat_pemasangan: 'Memproses perubahan alamat…',
    cari_faq: 'Mencari informasi terkait…',
  };
  const TOOL_LABELS_DONE = {
    cek_tagihan: 'Tagihan diperiksa',
    cek_gangguan_wilayah: 'Status gangguan diperiksa',
    buat_tiket_pengaduan: 'Tiket dibuat',
    cek_status_tiket: 'Status tiket diperiksa',
    ubah_alamat_pemasangan: 'Alamat diperbarui',
    cari_faq: 'Informasi ditemukan',
  };
  const PII_LABELS = { PERSON: 'nama', ADDRESS: 'alamat', NIK: 'NIK', EMAIL: 'email', PHONE: 'telepon' };

  /* ============================== State ============================== */
  let userId = localStorage.getItem(STORAGE_USER);
  if (!userId) { userId = 'u-' + crypto.randomUUID(); localStorage.setItem(STORAGE_USER, userId); }
  let sessionId = sessionStorage.getItem(STORAGE_SESSION) || localStorage.getItem(STORAGE_SESSION);
  let sending = false;
  let sessionTotalRedactions = 0;
  // Idle nudge: after a few minutes of silence mid-conversation, check in — same pattern as
  // real telco bots (Vero included). Purely client-side (no LLM call), so it costs no quota
  // and can't hallucinate. Fires once per idle period; only a genuine new message re-arms it.
  const IDLE_NUDGE_MS = 2 * 60 * 1000;
  const IDLE_NUDGE_TEXT = 'Ada lagi yang dapat Iting bantu? Silakan ketik yang Kakak butuhkan.';
  let idleTimer = null;
  let hasExchanged = false;
  const REPLY_TIMEOUT_MS = 90 * 1000;

  /* ============================== DOM refs ============================== */
  const $ = (id) => document.getElementById(id);
  const transcript = $('transcript');
  const transcriptInner = document.querySelector('.transcript-inner');
  const welcome = $('welcome');
  const form = $('composerForm');
  const input = $('messageInput');
  const sendBtn = $('sendBtn');
  const statusDot = $('statusDot');
  const statusText = $('statusText');
  const trustDetail = $('trustDetail');
  const greetingText = $('greetingText');
  const greetingTime = $('greetingTime');
  const resetBtn = $('resetBtn');
  const resetIcon = $('resetIcon');
  const shell = $('shell');

  /* ============================== Utilities ============================== */
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // Minimal, safe markdown: escapes HTML first, then applies a small allow-list of
  // transforms (bold, bullet/numbered lists, paragraphs). Never inserts raw model output.
  function renderMarkdown(raw) {
    const escaped = escapeHtml(raw);
    const lines = escaped.split('\n');
    let html = '', listType = null, buf = [];
    const flushList = () => {
      if (listType) { html += `<${listType}>${buf.join('')}</${listType}>`; buf = []; listType = null; }
    };
    const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    for (const line of lines) {
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ol) { if (listType !== 'ol') { flushList(); listType = 'ol'; } buf.push(`<li>${inline(ol[1])}</li>`); }
      else if (ul) { if (listType !== 'ul') { flushList(); listType = 'ul'; } buf.push(`<li>${inline(ul[1])}</li>`); }
      else if (line.trim() === '') { flushList(); }
      else { flushList(); html += `<p>${inline(line)}</p>`; }
    }
    flushList();
    return html || '<p></p>';
  }

  function scrollToBottom(smooth = true) {
    transcript.scrollTo({ top: transcript.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function timeNow(date = new Date()) {
    return date.toLocaleTimeString('id-ID', {
      timeZone: 'Asia/Jakarta',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    }) + ' WIB';
  }

  function updateOpeningGreeting() {
    const hour = Number(new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Jakarta',
      hour: '2-digit',
      hourCycle: 'h23',
    }).format(new Date()));
    const period = hour >= 4 && hour < 11 ? 'pagi'
      : hour >= 11 && hour < 15 ? 'siang'
      : hour >= 15 && hour < 18 ? 'sore'
      : 'malam';
    greetingText.textContent = `Selamat ${period}`;
    greetingTime.textContent = timeNow();
  }

  function setStatus(state, text) {
    statusDot.className = 'status-dot' + (state !== 'online' ? ' ' + state : '');
    statusText.textContent = text;
  }

  /* ============================== Rendering ============================== */
  const AGENT_AVATAR = `<img src="avatar.png" alt="" width="30" height="30">`;

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="bubble-col">
        <div class="bubble">${renderMarkdown(text)}</div>
        <div class="msg-meta">${timeNow()}</div>
      </div>`;
    transcriptInner.appendChild(row);
    scrollToBottom();
    return row.querySelector('.bubble-col');
  }

  // Attaches server-verified proof directly to the message that triggered it — clearer
  // than a strip elsewhere on the page, and only appears when something was actually found.
  function markRedacted(userCol, items) {
    if (!userCol || userCol.querySelector('.redact-note')) return;
    const note = document.createElement('div');
    note.className = 'redact-note';
    note.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>${escapeHtml(items.join(', '))} disamarkan sebelum diproses AI</span>`;
    userCol.appendChild(note);
    scrollToBottom();
  }

  function addAgentPlaceholder() {
    const row = document.createElement('div');
    row.className = 'row agent';
    row.innerHTML = `
      <div class="avatar" aria-hidden="true">${AGENT_AVATAR}</div>
      <div class="bubble-col" data-role="agent-col">
        <div class="bubble" data-role="agent-bubble"><div class="typing" aria-label="Sedang mengetik"><span></span><span></span><span></span></div></div>
      </div>`;
    transcriptInner.appendChild(row);
    scrollToBottom();
    return row.querySelector('[data-role="agent-col"]');
  }

  function addToolChip(col, toolName, state) {
    let chip = col.querySelector(`[data-tool="${toolName}"]`);
    const label = state === 'done' ? (TOOL_LABELS_DONE[toolName] || 'Selesai') : (TOOL_LABELS[toolName] || `Memproses ${toolName}…`);
    if (!chip) {
      chip = document.createElement('div');
      chip.className = 'tool-chip spinning';
      chip.dataset.tool = toolName;
      const bubble = col.querySelector('[data-role="agent-bubble"]');
      col.insertBefore(chip, bubble || null);
    }
    chip.className = 'tool-chip' + (state === 'done' ? ' done' : ' spinning');
    chip.innerHTML = `<span class="dot"></span><span>${escapeHtml(label)}</span>`;
    scrollToBottom();
  }

  // A trailing `[PILIHAN] Opsi 1 | Opsi 2` line (see prompts.py) becomes tappable quick-reply
  // buttons instead of text the customer has to retype — the single most recognisable pattern
  // of menu-driven telco assistants (Veronika/Telkomsel and similar). Parsed defensively so a
  // still-streaming, not-yet-complete line is simply left as plain text until it completes.
  const QUICK_REPLY_RE = /\n?\[PILIHAN\]\s*(.+?)\s*$/;
  function parseQuickReplies(text) {
    const m = text.match(QUICK_REPLY_RE);
    if (!m) return { text, options: [] };
    const options = m[1].split('|').map((s) => s.trim()).filter(Boolean).slice(0, 4);
    if (!options.length) return { text, options: [] };
    return { text: text.slice(0, m.index).trimEnd(), options };
  }

  // Safety net: the server restores [REDACT_*] tokens in the agent's own reply before it
  // streams to us, but if that ever fails (e.g. the model referenced a token the vault
  // doesn't have), never show the raw placeholder syntax to the user — swap it for a plain
  // Indonesian phrase instead. This never reveals the real value (the frontend never has
  // it), it just avoids leaking implementation detail into a customer-facing chat.
  const LEAKED_TOKEN_RE = /\[REDACT_(NAMA|ADDRESS|NIK|EMAIL|PHONE)(?:_\d+)?\]/g;
  const LEAKED_TOKEN_FALLBACK = {
    NAMA: 'data nama Anda', ADDRESS: 'alamat Anda', NIK: 'NIK Anda',
    EMAIL: 'email Anda', PHONE: 'nomor HP Anda',
  };
  function sanitizeLeakedTokens(text) {
    return text.replace(LEAKED_TOKEN_RE, (_, tag) => LEAKED_TOKEN_FALLBACK[tag] || 'data Anda');
  }

  function setAgentText(col, text) {
    const bubble = col.querySelector('[data-role="agent-bubble"]');
    bubble.innerHTML = renderMarkdown(parseQuickReplies(sanitizeLeakedTokens(text)).text);
  }

  function addQuickReplies(col, options) {
    if (!options.length || col.querySelector('.quick-replies')) return;
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quick-reply-chip';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        wrap.remove(); // this turn is answered — don't leave stale options tappable
        sendMessage(opt);
      });
      wrap.appendChild(btn);
    }
    col.appendChild(wrap);
    scrollToBottom();
  }

  function finalizeAgentMessage(col, text) {
    if (!col.querySelector('.msg-meta')) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = timeNow();
      col.appendChild(meta);
    }
    if (typeof text === 'string') addQuickReplies(col, parseQuickReplies(text).options);
  }

  function removeIfEmpty(col) {
    const bubble = col.querySelector('[data-role="agent-bubble"]');
    const hasOtherContent = col.querySelector('.tool-chip') || col.querySelector('.quick-replies');
    if (bubble && !bubble.textContent.trim() && !hasOtherContent) {
      col.closest('.row').remove();
    } else if (bubble && !bubble.textContent.trim()) {
      bubble.remove(); // only tool chips/quick-replies happened, no final text — drop the empty bubble
    }
  }

  function addSystemError(message, onRetry) {
    const row = document.createElement('div');
    row.className = 'row system';
    row.innerHTML = `
      <div class="system-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>${escapeHtml(message)}</span>
        ${onRetry ? '<button type="button" class="retry-btn">Coba lagi</button>' : ''}
      </div>`;
    if (onRetry) row.querySelector('.retry-btn').addEventListener('click', onRetry);
    transcriptInner.appendChild(row);
    scrollToBottom();
  }

  const DEFAULT_TRUST_DETAIL = 'Data pribadi Anda disamarkan otomatis sebelum diproses AI';

  function sessionTrustDetail() {
    if (sessionTotalRedactions === 0) return DEFAULT_TRUST_DETAIL;
    return `${sessionTotalRedactions} data pribadi telah disamarkan pada sesi ini`;
  }

  // Quiet, text-only acknowledgement — no colour-block banner. This is real
  // evidence (server-verified counts from the guardrail), so it earns a brief
  // moment of attention, not a permanent marketing strip.
  function flashTrust(detail) {
    trustDetail.textContent = detail;
    trustDetail.classList.add('flash');
    setTimeout(() => {
      trustDetail.classList.remove('flash');
      trustDetail.textContent = sessionTrustDetail();
    }, 2200);
  }

  // Trashes the current conversation: clears the visible transcript, drops the local
  // session reference, and best-effort deletes the session server-side too (so the vault
  // and history don't just sit around orphaned) — a fresh session is created lazily on the
  // next message via ensureSession(), same as a brand-new visit.
  async function resetConversation() {
    const oldId = sessionId;
    sessionId = null;
    sessionStorage.removeItem(STORAGE_SESSION);
    localStorage.removeItem(STORAGE_SESSION);
    transcriptInner.innerHTML = '';
    transcriptInner.appendChild(welcome);
    welcome.querySelector('.initial-suggestions')?.classList.remove('hidden');
    updateOpeningGreeting();
    sessionTotalRedactions = 0;
    trustDetail.textContent = DEFAULT_TRUST_DETAIL;
    cancelIdleNudge();
    hasExchanged = false;
    input.focus();
    if (oldId) {
      try { await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${oldId}`, { method: 'DELETE' }); }
      catch (_) { /* best-effort — an orphaned in-memory session is harmless */ }
    }
  }

  /* ============================== API ============================== */
  async function apiFetch(path, options) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    return res;
  }

  // Returns the existing Session (with its `events`) when one was found and reused,
  // or null when a fresh session was created — the caller uses this to decide whether
  // there is history to replay into the transcript.
  async function ensureSession() {
    if (sessionId) {
      try {
        const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${sessionId}`, { method: 'GET' });
        return await res.json();
      } catch (_) { /* session gone (server restarted) — fall through and create a new one */ }
    }
    const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions`, { method: 'POST', body: '{}' });
    const data = await res.json();
    sessionId = data.id;
    sessionStorage.setItem(STORAGE_SESSION, sessionId);
    localStorage.setItem(STORAGE_SESSION, sessionId);
    return null;
  }

  async function checkHealth() {
    try {
      await apiFetch('/list-apps', { method: 'GET' });
      setStatus('online', 'Siap membantu');
      return true;
    } catch (_) {
      setStatus('offline', 'Tidak dapat terhubung');
      return false;
    }
  }

  // Rebuilds the transcript from a Session's stored events after a page reload — otherwise
  // the conversation continues correctly server-side (context, vault) but the page would
  // look empty, as if it had been reset. Only final text is replayed (no tool-call chips,
  // no typing indicator) — that transient activity already played out live the first time.
  function renderHistory(events) {
    if (!events || !events.length) return;
    welcome.querySelector('.initial-suggestions')?.classList.add('hidden');
    let redactedTotal = 0;
    let currentUserCol = null;    // the most recent user bubble, for attaching its redact-note
    let markedThisTurn = false;   // only the first detection per turn is real (see sendMessage)
    let lastUserText = null, answered = true;
    for (const evt of events) {
      const role = evt.content && evt.content.role;
      const parts = (evt.content && evt.content.parts) || [];
      for (const part of parts) {
        if (part.thought || typeof part.text !== 'string' || !part.text.trim()) continue;
        if (role === 'user') {
          currentUserCol = addUserMessage(part.text);
          markedThisTurn = false;
          lastUserText = part.text;
          answered = false;
        } else {
          const col = addAgentPlaceholder();
          setAgentText(col, part.text);
          finalizeAgentMessage(col, part.text);
          answered = true;
        }
      }
      const detected = evt.actions && evt.actions.stateDelta && evt.actions.stateDelta.pii_report
        && evt.actions.stateDelta.pii_report.detected;
      if (detected) {
        const entries = Object.entries(detected).filter(([, n]) => n > 0);
        if (entries.length) {
          redactedTotal += entries.reduce((sum, [, n]) => sum + n, 0);
          if (!markedThisTurn && currentUserCol) {
            markRedacted(currentUserCol, entries.map(([label, n]) => `${n} ${PII_LABELS[label] || label}`));
            markedThisTurn = true;
          }
        }
      }
    }
    sessionTotalRedactions = redactedTotal;
    trustDetail.textContent = sessionTrustDetail();
    // Reloading while a reply is in flight cancels the run server-side, leaving the user's
    // last message stored but unanswered — offer to resend it instead of a silent dead end.
    if (!answered && lastUserText && currentUserCol) {
      const orphanRow = currentUserCol.closest('.row');
      addSystemError('Pesan terakhir Kakak belum sempat dijawab.', () => {
        orphanRow?.remove();
        document.querySelectorAll('.row.system').forEach((el) => el.remove());
        sendMessage(lastUserText);
      });
    }
    scrollToBottom(false);
  }

  /* ============================== Send flow ============================== */
  // Quick-reply chips answer ONE specific turn. Once the user moves on — by clicking a chip
  // (handled inline where it's clicked) or just typing something else — every earlier turn's
  // chip group is stale: the conversation has moved past whatever question they answered, so
  // tapping one now could send an option that no longer matches the current context.
  function clearStaleQuickReplies() {
    document.querySelectorAll('.quick-replies').forEach((el) => el.remove());
    welcome.querySelector('.initial-suggestions')?.classList.add('hidden');
  }

  function cancelIdleNudge() {
    clearTimeout(idleTimer);
    idleTimer = null;
  }

  function scheduleIdleNudge() {
    cancelIdleNudge();
    if (!hasExchanged) return;
    idleTimer = setTimeout(() => {
      if (sending) { scheduleIdleNudge(); return; }
      const col = addAgentPlaceholder();
      setAgentText(col, IDLE_NUDGE_TEXT);
      finalizeAgentMessage(col, IDLE_NUDGE_TEXT);
      scrollToBottom();
    }, IDLE_NUDGE_MS);
  }

  async function sendMessage(text) {
    if (sending || !text.trim()) return;
    clearStaleQuickReplies();
    cancelIdleNudge();
    sending = true;
    sendBtn.disabled = true;
    input.value = '';
    autoGrow();

    const userCol = addUserMessage(text);

    let agentCol;
    let abortTimer = null;
    try {
      await ensureSession();
      agentCol = addAgentPlaceholder();

      // Backstop only: the server bounds each Gemini call itself (GEMINI_TIMEOUT_S), this
      // just guarantees the typing indicator can never spin forever.
      const controller = new AbortController();
      abortTimer = setTimeout(() => controller.abort(), REPLY_TIMEOUT_MS);
      const res = await fetch(API_BASE + '/run_sse', {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          app_name: APP_NAME,
          user_id: userId,
          session_id: sessionId,
          streaming: false,
          new_message: { role: 'user', parts: [{ text }] },
        }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let finalText = '';
      let sawContent = false;
      let firstTextChunk = true;
      let shownError = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.split('\n').find((l) => l.startsWith('data:'));
          if (!line) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          let evt;
          try { evt = JSON.parse(payload); } catch (_) { continue; }

          // ADK reports model/tool errors as errorCode/errorMessage on an event, but an
          // exception inside the run (e.g. a Gemini timeout) arrives as {"error": "..."}.
          if (evt.errorCode || evt.errorMessage || evt.error) {
            sawContent = true;
            if (shownError) continue; // one failure can surface as both kinds — show it once
            shownError = true;
            removeIfEmpty(agentCol);
            addSystemError(
              friendlyError(evt.errorCode, evt.errorMessage || evt.error),
              () => sendMessage(text)
            );
            sawContent = true;
            continue;
          }

          // Guardrail evidence: real state_delta written by before_model_callback —
          // this is server-verified (counts only, never the redacted values themselves).
          const delta = evt.actions && evt.actions.stateDelta;
          if (delta && delta['pii_report'] && delta['pii_report'].detected) {
            const entries = Object.entries(delta['pii_report'].detected).filter(([, n]) => n > 0);
            if (entries.length) {
              const turnTotal = entries.reduce((sum, [, n]) => sum + n, 0);
              sessionTotalRedactions += turnTotal;
              const items = entries.map(([label, n]) => `${n} ${PII_LABELS[label] || label}`);
              flashTrust(`Baru saja menyamarkan ${items.join(', ')} pada pesan ini`);
              markRedacted(userCol, items);
            }
          }

          const parts = (evt.content && evt.content.parts) || [];
          for (const part of parts) {
            if (part.functionCall) {
              addToolChip(agentCol, part.functionCall.name, 'pending');
            } else if (part.functionResponse) {
              addToolChip(agentCol, part.functionResponse.name, 'done');
            } else if (typeof part.text === 'string' && !part.thought) {
              if (firstTextChunk) {
                const bubble = agentCol.querySelector('[data-role="agent-bubble"]');
                if (bubble) bubble.innerHTML = '';
                firstTextChunk = false;
              }
              finalText += part.text;
              setAgentText(agentCol, finalText);
              sawContent = true;
              scrollToBottom();
            }
          }
        }
      }

      if (sawContent) {
        finalizeAgentMessage(agentCol, finalText);
        hasExchanged = true;
        scheduleIdleNudge();
      }
      removeIfEmpty(agentCol);
    } catch (err) {
      if (agentCol) removeIfEmpty(agentCol);
      if (err && err.name === 'AbortError') {
        addSystemError('Balasan Iting terlalu lama. Silakan coba lagi.', () => sendMessage(text));
      } else {
        addSystemError(
          'Tidak dapat terhubung ke server. Periksa koneksi Anda dan coba lagi.',
          () => sendMessage(text)
        );
        setStatus('offline', 'Tidak dapat terhubung');
      }
    } finally {
      clearTimeout(abortTimer);
      sending = false;
      updateSendState();
      input.focus();
    }
  }

  function friendlyError(code, message) {
    if (code === 'UNAVAILABLE' || /high demand|503/i.test(message || '')) {
      return 'Server sedang sibuk. Silakan coba lagi dalam beberapa saat.';
    }
    if (/timeout|timed out|deadline/i.test(message || '')) {
      return 'Balasan Iting terlalu lama. Silakan coba lagi.';
    }
    if (/PII|guardrail|gangguan/i.test(message || '')) {
      return message; // guardrail's own fail-closed message is already user-facing Indonesian
    }
    return 'Terjadi kendala saat memproses pesan Anda. Silakan coba lagi.';
  }

  /* ============================== Composer UX ============================== */
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  function updateSendState() {
    sendBtn.disabled = sending || !input.value.trim();
  }

  input.addEventListener('input', () => { autoGrow(); updateSendState(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    if (text.trim()) sendMessage(text);
  });
  document.querySelectorAll('.suggestion-chip').forEach((btn) => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
  });
  // Two-step confirm on the trash icon (no native confirm() — see the note on the old
  // per-session delete button this replaced: unreliable in embedded/automated contexts,
  // and it looked inconsistent with the rest of the UI anyway). First click arms it
  // (icon swaps to a checkmark for 3s), second click within that window resets for real.
  const RESET_ICON = resetIcon.innerHTML;
  const CONFIRM_ICON = '<path d="M20 6 9 17l-5-5"/>';
  (function wireResetButton() {
    let armed = false, revertTimer = null;
    resetBtn.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        resetIcon.innerHTML = CONFIRM_ICON;
        resetBtn.title = 'Klik lagi untuk menghapus';
        revertTimer = setTimeout(() => {
          armed = false;
          resetIcon.innerHTML = RESET_ICON;
          resetBtn.title = 'Hapus percakapan';
        }, 3000);
        return;
      }
      clearTimeout(revertTimer);
      armed = false;
      resetIcon.innerHTML = RESET_ICON;
      resetBtn.title = 'Hapus percakapan';
      resetConversation();
    });
  })();

  /* ============================== Boot ============================== */
  (async function init() {
    updateOpeningGreeting();
    setInterval(updateOpeningGreeting, 60_000);
    updateSendState();
    input.focus();
    const ok = await checkHealth();
    if (!ok) return;
    try {
      const session = await ensureSession();
      if (session) renderHistory(session.events);
    } catch (_) { /* couldn't load history — user can still start typing */ }
  })();
})();
</script>
</body>
</html>
