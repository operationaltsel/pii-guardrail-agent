name: tests

on:
  push:
  pull_request:

jobs:
  agent:
    name: agent (guardrail + ADK e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - run: pip install -r agent/requirements-dev.txt
      - run: cd agent && python -m pytest tests -q

  ner-service:
    name: ner_service (REST API contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ner_service/requirements.txt
      - run: pip install -r ner_service/requirements.txt pytest
      - run: cd ner_service && python -m pytest tests -q
