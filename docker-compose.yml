# Local end-to-end run: NER service + CS agent + chat UI, wired together like they would be
# in separate GKE deployments. `docker compose up --build`, then open http://localhost:3100.
services:
  ner-service:
    build: ./ner_service
    ports: ["8001:8001"]
    environment:
      - NER_THREADS=2
      - OMP_NUM_THREADS=2
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  cs-agent:
    build: ./agent
    ports: ["8000:8000"]
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env or the environment}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_TIMEOUT_S=${GEMINI_TIMEOUT_S:-25}
      - NER_SERVICE_URL=http://ner-service:8001
      - NER_TIMEOUT_S=3.0
      - PII_REDACTION_MODE=${PII_REDACTION_MODE:-pseudonymize}
      - PII_FAIL_MODE=${PII_FAIL_MODE:-closed}
      - ALLOW_ORIGINS=http://localhost:3100
    volumes:
      - cs-agent-data:/app/data   # mock customer/ticket SQLite db — survives `down`/`up`
    depends_on:
      ner-service:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }

  frontend:
    build: ./frontend
    ports: ["3100:80"]
    depends_on: [cs-agent]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
        reservations: { cpus: "0.05", memory: 16M }

volumes:
  cs-agent-data:
