<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nara</title>
<meta name="description" content="Asisten AI customer support dengan perlindungan data pribadi otomatis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================== Design tokens ==============================
     Flat, restrained palette — one accent colour, no gradients, no drop-shadow
     decoration. Reads as a real assistant app (Claude/ChatGPT-shaped), not a
     marketing widget: full-bleed shell, no floating card, no banner chrome. */
  :root {
    --color-accent: #2F5DE0;
    --color-accent-hover: #2748B8;
    --color-on-accent: #FFFFFF;
    --color-background: #FFFFFF;
    --color-surface: #F7F7F8;
    --color-foreground: #1A1A1A;
    --color-muted-foreground: #6B6B6F;
    --color-border: #E6E6E8;
    --color-destructive: #B3271E;
    --color-destructive-bg: #FCEEED;
    --color-ring: #2F5DE0;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-body: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background: #1B1C1D;
      --color-surface: #232425;
      --color-foreground: #ECECEC;
      --color-muted-foreground: #9A9A9E;
      --color-border: #35363A;
      --color-destructive: #F2938C;
      --color-destructive-bg: #3A2321;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-background: #1B1C1D;
    --color-surface: #232425;
    --color-foreground: #ECECEC;
    --color-muted-foreground: #9A9A9E;
    --color-border: #35363A;
    --color-destructive: #F2938C;
    --color-destructive-bg: #3A2321;
    color-scheme: dark;
  }

  /* ============================== Reset & base ============================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--color-background);
    color: var(--color-foreground);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 25%, transparent); }
  a { color: var(--color-accent); }

  :focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ============================== Shell layout ==============================
     No card, no shadow, no rounded outer frame — the app fills the viewport,
     same as a real assistant product. */
  .shell {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }
  .app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    height: 100%;
  }

  /* ============================== Sidebar ==============================
     Desktop: a real flex column that pushes the chat over when open (width
     transition, not a floating overlay). Below 860px there isn't room to push,
     so it becomes a slide-in panel with a backdrop instead. */
  .sidebar {
    width: 260px; flex-shrink: 0; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    transition: width 180ms ease, border-color 180ms ease;
  }
  .shell:not(.sidebar-open) .sidebar { width: 0; border-color: transparent; }
  .sidebar-inner { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; height: 100%; }
  .sidebar-top { padding: var(--space-3); flex-shrink: 0; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 1px solid var(--color-border); background: none; color: var(--color-foreground);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13.5px; cursor: pointer;
    min-height: 36px; transition: background 120ms ease;
  }
  .new-chat-btn:hover { background: var(--color-background); }
  .new-chat-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .session-list { flex: 1; overflow-y: auto; padding: 0 var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 1px; }
  .session-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer; color: var(--color-foreground); text-decoration: none;
    border: none; background: none; width: 100%; text-align: left; font-size: 13px;
  }
  .session-item:hover { background: var(--color-background); }
  .session-item.active { background: var(--color-background); font-weight: 600; }
  .session-item .session-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .session-delete {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 5px; border: none; background: none;
    color: var(--color-muted-foreground); display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  .session-item:hover .session-delete { display: flex; }
  .session-item .session-delete:hover { background: var(--color-border); color: var(--color-destructive); }
  .session-item .session-delete svg { width: 13px; height: 13px; }
  .session-empty { padding: var(--space-3) 10px; font-size: 12.5px; color: var(--color-muted-foreground); }

  .sidebar-backdrop { display: none; }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 40; width: 280px;
      transform: translateX(-100%); border-right: 1px solid var(--color-border);
      transition: transform 200ms ease;
    }
    .sidebar-inner { width: 280px; }
    .shell.sidebar-open .sidebar { transform: translateX(0); box-shadow: 12px 0 32px rgba(0,0,0,.18); }
    .sidebar-backdrop {
      display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none; transition: opacity 200ms ease;
    }
    .shell.sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
  }

  /* ============================== Header ============================== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted-foreground); }
  .status-dot { width: 6px; height: 6px; border-radius: 999px; background: #2E9950; flex-shrink: 0; }
  .status-dot.offline { background: var(--color-destructive); }
  .status-dot.connecting { background: #C08A1E; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .header-actions { display: flex; align-items: center; gap: var(--space-1); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--color-muted-foreground); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--color-surface); color: var(--color-foreground); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ============================== Transcript ============================== */
  .transcript {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
  }
  .transcript-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-5) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    min-height: 100%;
  }

  .welcome {
    margin: auto 0;
    padding: var(--space-8) 0;
  }
  .welcome h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 var(--space-2); }
  .welcome p { max-width: 480px; margin: 0 0 var(--space-5); font-size: 14.5px; line-height: 1.6; color: var(--color-muted-foreground); }
  .suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .suggestion-chip {
    border: 1px solid var(--color-border); background: none;
    color: var(--color-foreground); border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; cursor: pointer; transition: border-color 120ms, background 120ms;
    min-height: 36px;
  }
  .suggestion-chip:hover { border-color: var(--color-accent); background: var(--color-surface); }

  .row { display: flex; gap: var(--space-3); max-width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.agent { align-items: flex-start; }
  .row.system { justify-content: center; }

  /* Assistant messages: no bubble, plain text on the page background — this is
     the single biggest cue that reads as "real AI assistant" vs. "support widget". */
  .avatar {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px; background: var(--color-accent); color: var(--color-on-accent);
  }
  .avatar svg { width: 14px; height: 14px; }

  .bubble-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .row.agent .bubble-col { max-width: 100%; }
  .row.user .bubble-col { align-items: flex-end; max-width: 80%; }

  .bubble {
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--color-surface);
    padding: 9px 14px;
    border-radius: var(--radius-md);
  }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 600; }
  .bubble a { color: inherit; text-decoration: underline; }

  .msg-meta { font-size: 11px; color: var(--color-muted-foreground); padding: 0 2px; }

  /* Per-message proof that the guardrail acted on THIS message — attached where the
     evidence is relevant, not as a page-wide banner. Only appears when something was
     actually found (server-verified), so it never fires on messages with no PII. */
  .redact-note {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--color-muted-foreground);
    padding: 0 2px; animation: fade-in 200ms ease;
  }
  .redact-note svg { width: 11px; height: 11px; flex-shrink: 0; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* Tool activity — a quiet inline line, not an iconography showcase */
  .tool-chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--color-muted-foreground);
    padding: 2px 0;
  }
  .tool-chip .dot { width: 4px; height: 4px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
  .tool-chip.spinning .dot { animation: dot-pulse 1s ease-in-out infinite; }
  .tool-chip.done { color: var(--color-muted-foreground); }
  .tool-chip.done .dot { background: #2E9950; }
  @keyframes dot-pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; height: 22px; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--color-muted-foreground);
    animation: bounce 1.3s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:.4 } 30%{ transform: translateY(-4px); opacity:1 } }

  /* System / error messages */
  .system-msg {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; padding: 9px 13px; border-radius: var(--radius-sm);
    background: var(--color-destructive-bg); color: var(--color-destructive);
    max-width: 480px;
  }
  .system-msg svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
  .system-msg .retry-btn {
    margin-left: auto; flex-shrink: 0; border: 1px solid currentColor; background: transparent;
    color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; cursor: pointer;
    min-height: 28px;
  }
  .system-msg .retry-btn:hover { background: color-mix(in srgb, var(--color-destructive) 10%, transparent); }

  /* ============================== Composer ============================== */
  .composer-wrap {
    flex-shrink: 0;
    padding: 0 var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom));
  }
  .composer-inner { max-width: 720px; margin: 0 auto; }
  .composer {
    display: flex; align-items: flex-end; gap: var(--space-2);
    border: 1px solid var(--color-border); border-radius: 24px;
    background: var(--color-background);
    padding: 8px 8px 8px 18px;
    transition: border-color 120ms ease;
  }
  .composer:focus-within { border-color: var(--color-accent); }
  .composer textarea {
    flex: 1; border: none; background: transparent; resize: none;
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    color: var(--color-foreground); padding: 7px 0; max-height: 140px; min-height: 22px;
  }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: var(--color-muted-foreground); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 999px; border: none; flex-shrink: 0;
    background: var(--color-accent); color: var(--color-on-accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 120ms ease, opacity 120ms ease;
  }
  .send-btn:hover:not(:disabled) { background: var(--color-accent-hover); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }
  .composer-foot {
    margin: var(--space-2) 2px 0;
    font-size: 11.5px; color: var(--color-muted-foreground);
    text-align: center;
  }
  .composer-foot .trust-note { transition: color 200ms ease; }
  .composer-foot .trust-note.flash { color: var(--color-accent); }

  /* Scrollbar (webkit) */
  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 999px; }
  .transcript::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="shell" id="shell">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ============================== Sidebar ============================== -->
  <aside class="sidebar" id="sidebar" aria-label="Riwayat percakapan">
    <div class="sidebar-inner">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="sidebarNewChat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Percakapan baru
        </button>
      </div>
      <nav class="session-list" id="sessionList"></nav>
    </div>
  </aside>

  <div class="app">

  <!-- ============================== Header ============================== -->
  <header class="header">
    <div class="brand">
      <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Tampilkan/sembunyikan riwayat percakapan" title="Riwayat percakapan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="brand-name">Nara</span>
      <span class="status-line"><span class="status-dot connecting" id="statusDot" aria-hidden="true"></span><span id="statusText">Menghubungkan…</span></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Ganti tampilan terang/gelap" title="Ganti tampilan">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="newChatBtn" type="button" aria-label="Mulai percakapan baru" title="Percakapan baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <!-- ============================== Transcript ============================== -->
  <main class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Riwayat percakapan">
    <div class="transcript-inner">
      <div class="welcome" id="welcome">
        <h2>Ada yang bisa dibantu?</h2>
        <p>Ceritakan kendala internet, tagihan, atau pertanyaan lain. Nama, alamat, dan data pribadi Anda otomatis disamarkan sebelum diproses AI.</p>
        <div class="suggestions">
          <button class="suggestion-chip" type="button" data-prompt="Internet di rumah saya mati sejak pagi, mohon dibantu.">Internet saya mati</button>
          <button class="suggestion-chip" type="button" data-prompt="Saya mau cek tagihan bulan ini.">Cek tagihan</button>
          <button class="suggestion-chip" type="button" data-prompt="Saya ingin pindah alamat pemasangan.">Pindah alamat</button>
          <button class="suggestion-chip" type="button" data-prompt="Lampu indikator modem saya menyala merah.">Lampu modem merah</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ============================== Composer ============================== -->
  <div class="composer-wrap">
    <div class="composer-inner">
      <form class="composer" id="composerForm">
        <label for="messageInput" class="sr-only">Tulis pesan</label>
        <textarea id="messageInput" rows="1" placeholder="Tulis pesan…" maxlength="2000" autocomplete="off"></textarea>
        <button class="send-btn" type="submit" id="sendBtn" aria-label="Kirim pesan" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <div class="composer-foot">
        <span class="trust-note" id="trustDetail">Data pribadi Anda disamarkan otomatis sebelum diproses AI</span>
      </div>
    </div>
  </div>

  </div>

</div>

<script>
(() => {
  'use strict';

  /* ============================== Config ============================== */
  const params = new URLSearchParams(location.search);
  const API_BASE = params.get('api') || window.NUSATEL_API_BASE || 'http://localhost:8000';
  const APP_NAME = 'cs_agent';
  const STORAGE_USER = 'nusatel_user_id';
  const STORAGE_SESSION = 'nusatel_session_id';
  const STORAGE_THEME = 'nusatel_theme';

  const TOOL_LABELS = {
    cek_tagihan: 'Mengecek tagihan…',
    cek_gangguan_wilayah: 'Mengecek status gangguan…',
    buat_tiket_pengaduan: 'Membuat tiket pengaduan…',
    cek_status_tiket: 'Mengecek status tiket…',
    ubah_alamat_pemasangan: 'Memproses perubahan alamat…',
    cari_faq: 'Mencari informasi terkait…',
  };
  const TOOL_LABELS_DONE = {
    cek_tagihan: 'Tagihan diperiksa',
    cek_gangguan_wilayah: 'Status gangguan diperiksa',
    buat_tiket_pengaduan: 'Tiket dibuat',
    cek_status_tiket: 'Status tiket diperiksa',
    ubah_alamat_pemasangan: 'Alamat diperbarui',
    cari_faq: 'Informasi ditemukan',
  };
  const PII_LABELS = { PERSON: 'nama', ADDRESS: 'alamat', NIK: 'NIK', EMAIL: 'email', PHONE: 'telepon' };

  /* ============================== State ============================== */
  let userId = localStorage.getItem(STORAGE_USER);
  if (!userId) { userId = 'u-' + crypto.randomUUID(); localStorage.setItem(STORAGE_USER, userId); }
  let sessionId = sessionStorage.getItem(STORAGE_SESSION) || localStorage.getItem(STORAGE_SESSION);
  let sending = false;
  let sessionTotalRedactions = 0;

  /* ============================== DOM refs ============================== */
  const $ = (id) => document.getElementById(id);
  const transcript = $('transcript');
  const transcriptInner = document.querySelector('.transcript-inner');
  const welcome = $('welcome');
  const form = $('composerForm');
  const input = $('messageInput');
  const sendBtn = $('sendBtn');
  const statusDot = $('statusDot');
  const statusText = $('statusText');
  const trustDetail = $('trustDetail');
  const themeToggle = $('themeToggle');
  const themeIcon = $('themeIcon');
  const shell = $('shell');
  const sidebarToggle = $('sidebarToggle');
  const sidebarBackdrop = $('sidebarBackdrop');
  const sidebarNewChat = $('sidebarNewChat');
  const sessionList = $('sessionList');

  /* ============================== Utilities ============================== */
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // Minimal, safe markdown: escapes HTML first, then applies a small allow-list of
  // transforms (bold, bullet/numbered lists, paragraphs). Never inserts raw model output.
  function renderMarkdown(raw) {
    const escaped = escapeHtml(raw);
    const lines = escaped.split('\n');
    let html = '', listType = null, buf = [];
    const flushList = () => {
      if (listType) { html += `<${listType}>${buf.join('')}</${listType}>`; buf = []; listType = null; }
    };
    const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    for (const line of lines) {
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ol) { if (listType !== 'ol') { flushList(); listType = 'ol'; } buf.push(`<li>${inline(ol[1])}</li>`); }
      else if (ul) { if (listType !== 'ul') { flushList(); listType = 'ul'; } buf.push(`<li>${inline(ul[1])}</li>`); }
      else if (line.trim() === '') { flushList(); }
      else { flushList(); html += `<p>${inline(line)}</p>`; }
    }
    flushList();
    return html || '<p></p>';
  }

  function scrollToBottom(smooth = true) {
    transcript.scrollTo({ top: transcript.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function timeNow() {
    return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function setStatus(state, text) {
    statusDot.className = 'status-dot' + (state !== 'online' ? ' ' + state : '');
    statusText.textContent = text;
  }

  /* ============================== Rendering ============================== */
  const AGENT_AVATAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg>`;

  function ensureWelcomeHidden() {
    if (welcome && welcome.parentNode) welcome.remove();
  }

  function addUserMessage(text) {
    ensureWelcomeHidden();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="bubble-col">
        <div class="bubble">${renderMarkdown(text)}</div>
        <div class="msg-meta">${timeNow()}</div>
      </div>`;
    transcriptInner.appendChild(row);
    scrollToBottom();
    return row.querySelector('.bubble-col');
  }

  // Attaches server-verified proof directly to the message that triggered it — clearer
  // than a strip elsewhere on the page, and only appears when something was actually found.
  function markRedacted(userCol, items) {
    if (!userCol || userCol.querySelector('.redact-note')) return;
    const note = document.createElement('div');
    note.className = 'redact-note';
    note.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>${escapeHtml(items.join(', '))} disamarkan sebelum diproses AI</span>`;
    userCol.appendChild(note);
    scrollToBottom();
  }

  function addAgentPlaceholder() {
    ensureWelcomeHidden();
    const row = document.createElement('div');
    row.className = 'row agent';
    row.innerHTML = `
      <div class="avatar" aria-hidden="true">${AGENT_AVATAR}</div>
      <div class="bubble-col" data-role="agent-col">
        <div class="bubble" data-role="agent-bubble"><div class="typing" aria-label="Sedang mengetik"><span></span><span></span><span></span></div></div>
      </div>`;
    transcriptInner.appendChild(row);
    scrollToBottom();
    return row.querySelector('[data-role="agent-col"]');
  }

  function addToolChip(col, toolName, state) {
    let chip = col.querySelector(`[data-tool="${toolName}"]`);
    const label = state === 'done' ? (TOOL_LABELS_DONE[toolName] || 'Selesai') : (TOOL_LABELS[toolName] || `Memproses ${toolName}…`);
    if (!chip) {
      chip = document.createElement('div');
      chip.className = 'tool-chip spinning';
      chip.dataset.tool = toolName;
      const bubble = col.querySelector('[data-role="agent-bubble"]');
      col.insertBefore(chip, bubble || null);
    }
    chip.className = 'tool-chip' + (state === 'done' ? ' done' : ' spinning');
    chip.innerHTML = `<span class="dot"></span><span>${escapeHtml(label)}</span>`;
    scrollToBottom();
  }

  function setAgentText(col, text) {
    const bubble = col.querySelector('[data-role="agent-bubble"]');
    bubble.innerHTML = renderMarkdown(text);
  }

  function finalizeAgentMessage(col) {
    if (!col.querySelector('.msg-meta')) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = timeNow();
      col.appendChild(meta);
    }
  }

  function removeIfEmpty(col) {
    const bubble = col.querySelector('[data-role="agent-bubble"]');
    if (bubble && !bubble.textContent.trim() && !col.querySelector('.tool-chip')) {
      col.closest('.row').remove();
    } else if (bubble && !bubble.textContent.trim()) {
      bubble.remove(); // only tool chips happened, no final text — drop the empty bubble
    }
  }

  function addSystemError(message, onRetry) {
    ensureWelcomeHidden();
    const row = document.createElement('div');
    row.className = 'row system';
    row.innerHTML = `
      <div class="system-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>${escapeHtml(message)}</span>
        ${onRetry ? '<button type="button" class="retry-btn">Coba lagi</button>' : ''}
      </div>`;
    if (onRetry) row.querySelector('.retry-btn').addEventListener('click', onRetry);
    transcriptInner.appendChild(row);
    scrollToBottom();
  }

  const DEFAULT_TRUST_DETAIL = 'Data pribadi Anda disamarkan otomatis sebelum diproses AI';

  function sessionTrustDetail() {
    if (sessionTotalRedactions === 0) return DEFAULT_TRUST_DETAIL;
    return `${sessionTotalRedactions} data pribadi telah disamarkan pada sesi ini`;
  }

  // Quiet, text-only acknowledgement — no colour-block banner. This is real
  // evidence (server-verified counts from the guardrail), so it earns a brief
  // moment of attention, not a permanent marketing strip.
  function flashTrust(detail) {
    trustDetail.textContent = detail;
    trustDetail.classList.add('flash');
    setTimeout(() => {
      trustDetail.classList.remove('flash');
      trustDetail.textContent = sessionTrustDetail();
    }, 2200);
  }

  /* ============================== API ============================== */
  async function apiFetch(path, options) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    return res;
  }

  // Returns the existing Session (with its `events`) when one was found and reused,
  // or null when a fresh session was created — the caller uses this to decide whether
  // there is history to replay into the transcript.
  async function ensureSession() {
    if (sessionId) {
      try {
        const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${sessionId}`, { method: 'GET' });
        return await res.json();
      } catch (_) { /* session gone (server restarted) — fall through and create a new one */ }
    }
    const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions`, { method: 'POST', body: '{}' });
    const data = await res.json();
    sessionId = data.id;
    sessionStorage.setItem(STORAGE_SESSION, sessionId);
    localStorage.setItem(STORAGE_SESSION, sessionId);
    return null;
  }

  async function checkHealth() {
    try {
      await apiFetch('/list-apps', { method: 'GET' });
      setStatus('online', 'Siap membantu');
      return true;
    } catch (_) {
      setStatus('offline', 'Tidak dapat terhubung');
      return false;
    }
  }

  function newConversation() {
    sessionId = null;
    sessionStorage.removeItem(STORAGE_SESSION);
    localStorage.removeItem(STORAGE_SESSION);
    transcriptInner.innerHTML = '';
    transcriptInner.appendChild(welcome);
    sessionTotalRedactions = 0;
    trustDetail.textContent = DEFAULT_TRUST_DETAIL;
    highlightActiveSession();
  }

  /* ============================== Sidebar: chat history ============================== */
  function setSidebarOpen(open) {
    shell.classList.toggle('sidebar-open', open);
  }
  sidebarToggle.addEventListener('click', () => setSidebarOpen(!shell.classList.contains('sidebar-open')));
  sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
  // Desktop: start open (there's room). Mobile: start closed (it would cover the chat).
  setSidebarOpen(window.matchMedia('(min-width: 860px)').matches);

  function closeSidebarOnMobile() {
    if (!window.matchMedia('(min-width: 860px)').matches) setSidebarOpen(false);
  }

  function relativeTime(unixSeconds) {
    const diffMin = Math.round((Date.now() / 1000 - unixSeconds) / 60);
    if (diffMin < 1) return 'Baru saja';
    if (diffMin < 60) return `${diffMin} menit lalu`;
    const diffHour = Math.round(diffMin / 60);
    if (diffHour < 24) return `${diffHour} jam lalu`;
    const diffDay = Math.round(diffHour / 24);
    if (diffDay === 1) return 'Kemarin';
    if (diffDay < 7) return `${diffDay} hari lalu`;
    return new Date(unixSeconds * 1000).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  }

  function sessionTitle(session) {
    return (session.state && session.state.title) || 'Percakapan baru';
  }

  function highlightActiveSession() {
    sessionList.querySelectorAll('.session-item').forEach((el) => {
      el.classList.toggle('active', el.dataset.sessionId === sessionId);
    });
  }

  async function loadSessionList() {
    let sessions;
    try {
      const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions`, { method: 'GET' });
      sessions = await res.json();
    } catch (_) {
      return; // sidebar just stays as-is; not worth surfacing an error for this
    }
    sessions.sort((a, b) => b.lastUpdateTime - a.lastUpdateTime);
    sessionList.innerHTML = '';
    if (!sessions.length) {
      const empty = document.createElement('div');
      empty.className = 'session-empty';
      empty.textContent = 'Belum ada percakapan.';
      sessionList.appendChild(empty);
      return;
    }
    for (const session of sessions) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'session-item';
      item.dataset.sessionId = session.id;
      item.innerHTML = `
        <span class="session-title">${escapeHtml(sessionTitle(session))}</span>
        <button type="button" class="session-delete" aria-label="Hapus percakapan" title="Hapus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>`;
      item.title = relativeTime(session.lastUpdateTime);
      item.addEventListener('click', () => openSession(session.id));
      wireDeleteButton(item.querySelector('.session-delete'), session.id);
      sessionList.appendChild(item);
    }
    highlightActiveSession();
  }

  async function openSession(id) {
    if (id === sessionId) { closeSidebarOnMobile(); return; }
    try {
      const res = await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${id}`, { method: 'GET' });
      const session = await res.json();
      sessionId = id;
      sessionStorage.setItem(STORAGE_SESSION, sessionId);
      localStorage.setItem(STORAGE_SESSION, sessionId);
      transcriptInner.innerHTML = '';
      transcriptInner.appendChild(welcome);
      sessionTotalRedactions = 0;
      trustDetail.textContent = DEFAULT_TRUST_DETAIL;
      renderHistory(session.events);
      highlightActiveSession();
    } catch (_) {
      addSystemError('Tidak dapat membuka percakapan ini.', null);
    }
    closeSidebarOnMobile();
  }

  async function deleteSession(id) {
    try {
      await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${id}`, { method: 'DELETE' });
    } catch (_) { /* best-effort */ }
    if (id === sessionId) newConversation();
    loadSessionList();
  }

  const CONFIRM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const DELETE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

  // Two-step delete entirely in our own markup (no native confirm() — unreliable across
  // embedded/automated browser contexts, and it looks inconsistent with the rest of the UI
  // anyway): first click arms it, a second click within 3s actually deletes.
  function wireDeleteButton(btn, id) {
    let armed = false, revertTimer = null;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!armed) {
        armed = true;
        btn.classList.add('confirm');
        btn.innerHTML = CONFIRM_ICON;
        btn.title = 'Klik lagi untuk menghapus';
        revertTimer = setTimeout(() => {
          armed = false;
          btn.classList.remove('confirm');
          btn.innerHTML = DELETE_ICON;
          btn.title = 'Hapus';
        }, 3000);
        return;
      }
      clearTimeout(revertTimer);
      deleteSession(id);
    });
  }

  // Gives the conversation a title (first ~60 chars of the user's first message) so it's
  // recognisable in the sidebar later — ChatGPT/Claude do the same. Written via ADK's
  // state-patch endpoint (no agent turn involved), then the list is refreshed.
  async function setSessionTitle(text) {
    try {
      await apiFetch(`/apps/${APP_NAME}/users/${userId}/sessions/${sessionId}`, {
        method: 'PATCH',
        body: JSON.stringify({ state_delta: { title: text.slice(0, 60) } }),
      });
    } catch (_) { /* non-critical */ }
    loadSessionList();
  }

  // Rebuilds the transcript from a Session's stored events after a page reload — otherwise
  // the conversation continues correctly server-side (context, vault) but the page would
  // look empty, as if it had been reset. Only final text is replayed (no tool-call chips,
  // no typing indicator) — that transient activity already played out live the first time.
  function renderHistory(events) {
    if (!events || !events.length) return;
    ensureWelcomeHidden();
    let redactedTotal = 0;
    let currentUserCol = null;    // the most recent user bubble, for attaching its redact-note
    let markedThisTurn = false;   // only the first detection per turn is real (see sendMessage)
    for (const evt of events) {
      const role = evt.content && evt.content.role;
      const parts = (evt.content && evt.content.parts) || [];
      for (const part of parts) {
        if (part.thought || typeof part.text !== 'string' || !part.text.trim()) continue;
        if (role === 'user') {
          currentUserCol = addUserMessage(part.text);
          markedThisTurn = false;
        } else {
          const col = addAgentPlaceholder();
          setAgentText(col, part.text);
          finalizeAgentMessage(col);
        }
      }
      const detected = evt.actions && evt.actions.stateDelta && evt.actions.stateDelta.pii_report
        && evt.actions.stateDelta.pii_report.detected;
      if (detected) {
        const entries = Object.entries(detected).filter(([, n]) => n > 0);
        if (entries.length) {
          redactedTotal += entries.reduce((sum, [, n]) => sum + n, 0);
          if (!markedThisTurn && currentUserCol) {
            markRedacted(currentUserCol, entries.map(([label, n]) => `${n} ${PII_LABELS[label] || label}`));
            markedThisTurn = true;
          }
        }
      }
    }
    sessionTotalRedactions = redactedTotal;
    trustDetail.textContent = sessionTrustDetail();
    scrollToBottom(false);
  }

  /* ============================== Send flow ============================== */
  async function sendMessage(text) {
    if (sending || !text.trim()) return;
    sending = true;
    sendBtn.disabled = true;
    input.value = '';
    autoGrow();

    const userCol = addUserMessage(text);

    let agentCol;
    try {
      const isNewSession = (await ensureSession()) === null;
      agentCol = addAgentPlaceholder();

      const res = await fetch(API_BASE + '/run_sse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          app_name: APP_NAME,
          user_id: userId,
          session_id: sessionId,
          streaming: false,
          new_message: { role: 'user', parts: [{ text }] },
        }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let finalText = '';
      let sawContent = false;
      let firstTextChunk = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.split('\n').find((l) => l.startsWith('data:'));
          if (!line) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          let evt;
          try { evt = JSON.parse(payload); } catch (_) { continue; }

          if (evt.errorCode || evt.errorMessage) {
            removeIfEmpty(agentCol);
            addSystemError(
              friendlyError(evt.errorCode, evt.errorMessage),
              () => sendMessage(text)
            );
            sawContent = true;
            continue;
          }

          // Guardrail evidence: real state_delta written by before_model_callback —
          // this is server-verified (counts only, never the redacted values themselves).
          const delta = evt.actions && evt.actions.stateDelta;
          if (delta && delta['pii_report'] && delta['pii_report'].detected) {
            const entries = Object.entries(delta['pii_report'].detected).filter(([, n]) => n > 0);
            if (entries.length) {
              const turnTotal = entries.reduce((sum, [, n]) => sum + n, 0);
              sessionTotalRedactions += turnTotal;
              const items = entries.map(([label, n]) => `${n} ${PII_LABELS[label] || label}`);
              flashTrust(`Baru saja menyamarkan ${items.join(', ')} pada pesan ini`);
              markRedacted(userCol, items);
            }
          }

          const parts = (evt.content && evt.content.parts) || [];
          for (const part of parts) {
            if (part.functionCall) {
              addToolChip(agentCol, part.functionCall.name, 'pending');
            } else if (part.functionResponse) {
              addToolChip(agentCol, part.functionResponse.name, 'done');
            } else if (typeof part.text === 'string' && !part.thought) {
              if (firstTextChunk) {
                const bubble = agentCol.querySelector('[data-role="agent-bubble"]');
                if (bubble) bubble.innerHTML = '';
                firstTextChunk = false;
              }
              finalText += part.text;
              setAgentText(agentCol, finalText);
              sawContent = true;
              scrollToBottom();
            }
          }
        }
      }

      if (sawContent) finalizeAgentMessage(agentCol);
      removeIfEmpty(agentCol);
      if (isNewSession && sawContent) setSessionTitle(text);
    } catch (err) {
      if (agentCol) removeIfEmpty(agentCol);
      addSystemError(
        'Tidak dapat terhubung ke server. Periksa koneksi Anda dan coba lagi.',
        () => sendMessage(text)
      );
      setStatus('offline', 'Tidak dapat terhubung');
    } finally {
      sending = false;
      updateSendState();
      input.focus();
    }
  }

  function friendlyError(code, message) {
    if (code === 'UNAVAILABLE' || /high demand|503/i.test(message || '')) {
      return 'Server sedang sibuk. Silakan coba lagi dalam beberapa saat.';
    }
    if (/PII|guardrail|gangguan/i.test(message || '')) {
      return message; // guardrail's own fail-closed message is already user-facing Indonesian
    }
    return 'Terjadi kendala saat memproses pesan Anda. Silakan coba lagi.';
  }

  /* ============================== Composer UX ============================== */
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  function updateSendState() {
    sendBtn.disabled = sending || !input.value.trim();
  }

  input.addEventListener('input', () => { autoGrow(); updateSendState(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    if (text.trim()) sendMessage(text);
  });
  document.querySelectorAll('.suggestion-chip').forEach((btn) => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
  });
  function startNewChat() {
    if (sending) return;
    newConversation();
    closeSidebarOnMobile();
    input.focus();
  }
  $('newChatBtn').addEventListener('click', startNewChat);
  sidebarNewChat.addEventListener('click', startNewChat);

  /* ============================== Theme ============================== */
  function applyTheme(mode) {
    if (mode === 'light' || mode === 'dark') {
      document.documentElement.setAttribute('data-theme', mode);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    const isDark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeIcon.innerHTML = isDark
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  }
  themeToggle.addEventListener('click', () => {
    const current = localStorage.getItem(STORAGE_THEME) ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_THEME, next);
    applyTheme(next);
  });
  applyTheme(localStorage.getItem(STORAGE_THEME));

  /* ============================== Boot ============================== */
  (async function init() {
    updateSendState();
    input.focus();
    const ok = await checkHealth();
    if (!ok) return;
    loadSessionList();
    try {
      const session = await ensureSession();
      if (session) renderHistory(session.events);
      highlightActiveSession();
    } catch (_) { /* couldn't load history — user can still start typing */ }
  })();
})();
</script>
</body>
</html>
